<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прости меня ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="card" id="question">
    <div class="emoji">🥺❤️</div>

    <h1>Прости меня?</h1>

    <p>
      Я правда не хотел тебя обидеть.<br>
      Ты мне очень дорога ❤️
    </p>

    <div class="buttons">
      <button id="yes">Да ❤️</button>
      <button id="no">Нет 😤</button>
    </div>
  </div>

  <div class="card hidden" id="success">
    <div class="emoji">🥰❤️</div>

    <h1>Я знал, что ты простишь!</h1>

    <p>
      Спасибо тебе, любимая ❤️<br><br>
      Я обещаю впредь думать перед тем,
      как что-то говорить, и никогда специально
      не буду тебя обижать.
      <br><br>
      Иди сюда, я тебя обниму 🫂
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
