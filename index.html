<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дина ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card" id="question">
    <div class="emoji">🥺❤️</div>
    <h1>Дина, извини меня ❤️</h1>
    <p>Ты простишь меня?</p>
    <div class="buttons">
      <button id="yes">Да ❤️</button>
      <button id="no">Нет 😤</button>
    </div>
  </div>
  <div class="card hidden" id="success">
    <div class="emoji">🥰❤️</div>
    <h1>Спасибо, Дина ❤️</h1>
    <p>
      Я тебя очень ценю 🥺<br>
      Обещаю впредь думать перед тем,
      как что-то говорить, и не обижать тебя.
      <br><br>
      Иди сюда, я тебя обниму 🫂❤️
    </p>
  </div>
  <script src="script.js"></script>
</body>
</html>
